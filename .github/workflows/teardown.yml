name: Teardown Azure

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE rolloff-ready to permanently remove this app and its email resources
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rolloff-ready-production
  cancel-in-progress: false

jobs:
  teardown:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DELETE rolloff-ready'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify all ownership tags and delete only this group
        run: python scripts/cloud.py teardown --confirmation "$CONFIRMATION"
