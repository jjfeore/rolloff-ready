name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build
      - run: pip install -r api/requirements.txt
      - run: python -m unittest discover -s api/tests -v
      - name: Validate infrastructure and deployment safeguards
        run: |
          az bicep install --version v0.47.16
          az bicep build --file infra/bootstrap.bicep --outfile "$RUNNER_TEMP/bootstrap.json"
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          python -m unittest discover -s scripts/tests -v
          python -c "import json; from pathlib import Path; c=json.loads(Path('dist/staticwebapp.config.json').read_text()); assert c['platform']['apiRuntime']=='python:3.11'"
      - name: Save verified frontend build for browser review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rolloff-ready-web
          path: dist/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
